# YOLO11s MURNI + P2 Head (Small Object Detection) TANPA Coordinate Attention

nc: 15

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 (Backbone P2)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 (Backbone P3)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6 (Backbone P4)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 (Akhir Backbone)

head:
  # FPN: P5 → P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 (Cat with Backbone P4)
  - [-1, 2, C3k2, [512, False]] # 13 (FPN P4 Output)

  # FPN: P4 → P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 (Cat with Backbone P3)
  - [-1, 2, C3k2, [256, False]] # 16 (FPN P3 Output)

  # 🟢 NEW: FPN P3 → P2 (TURUN 1 TINGKAT LAGI)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18 (Cat with Backbone P2)
  - [-1, 2, C3k2, [128, False]] # 19 🎯 OUTPUT P2 (Deteksi Objek Super Kecil)

  # 🟢 NEW: PAN P2 → P3 (NAIK KEMBALI)
  - [-1, 1, Conv, [128, 3, 2]] # 20 (Downsample)
  - [[-1, 16], 1, Concat, [1]] # 21 (Cat with FPN P3 idx 16)
  - [-1, 2, C3k2, [256, False]] # 22 🎯 OUTPUT P3 (Deteksi Objek Kecil)

  # PAN: P3 → P4
  - [-1, 1, Conv, [256, 3, 2]] # 23 (Downsample)
  - [[-1, 13], 1, Concat, [1]] # 24 (Cat with FPN P4 idx 13)
  - [-1, 2, C3k2, [512, False]] # 25 🎯 OUTPUT P4 (Deteksi Objek Sedang)

  # PAN: P4 → P5
  - [-1, 1, Conv, [512, 3, 2]] # 26 (Downsample)
  - [[-1, 10], 1, Concat, [1]] # 27 (Cat with Backbone P5 idx 10)
  - [-1, 2, C3k2, [1024, True]] # 28 🎯 OUTPUT P5 (Deteksi Objek Besar)

  # 🚀 Detect on 4 Scales: P2, P3, P4, P5
  - [[19, 22, 25, 28], 1, Detect, [nc]] # 29 (4 Output Heads)
