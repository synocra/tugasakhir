# YOLO11 with Coordinate Attention (CA)

nc: 15

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10
  - [-1, 1, CoordAtt, [1024]] # 11 ✅ CA (Ubah ke 1024 biar match 512 channel)

head:
  # FPN: P5 → P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 6], 1, Concat, [1]] # 13
  - [-1, 2, C3k2, [512, False]] # 14
  - [-1, 1, CoordAtt, [512]] # 15 ✅ CA (Indexnya bergeser jadi 15)

  # FPN: P4 → P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 4], 1, Concat, [1]] # 17
  - [-1, 2, C3k2, [256, False]] # 18 (P3 Output)

  # PAN: P3 → P4
  - [-1, 1, Conv, [256, 3, 2]] # 19
  - [[-1, 15], 1, Concat, [1]] # 20 (Rute diubah dari 14 ke 15 CoordAtt)
  - [-1, 2, C3k2, [512, False]] # 21 (P4 Output)

  # PAN: P4 → P5
  - [-1, 1, Conv, [512, 3, 2]] # 22
  - [[-1, 11], 1, Concat, [1]] # 23 (Rute nge-link ke 11 CoordAtt)
  - [-1, 2, C3k2, [1024, True]] # 24 (P5 Output)

  # Detect on P3, P4, P5
  - [[18, 21, 24], 1, Detect, [nc]] # 25 (Index rute digeser jadi 18, 21, 24)
